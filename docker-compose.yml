# Runs on the Synology NAS (Container Manager -> Project).
# Deploy path: /volume1/docker/storechecking  — one folder per app, matching the
# existing `solar` and `nas-uploader` folders. Container names are prefixed the same
# way `solar-*` containers are, so they stay distinguishable in Container Manager.
#
# Before building: create a .env file next to this one (see .env.example).
#
# Port 8140 was picked to avoid the services already running on this NAS:
#   8130 = solar-web, 8123 = home assistant (disabled), 1883 = mqtt

# ---------------------------------------------------------------------------
#  GIỚI HẠN BỘ NHỚ — đọc trước khi sửa
#
#  Máy này là DS124: 1GB RAM, hàn chết, không nâng cấp được. Nó đã sập hai lần
#  trong một tiếng vì cạn bộ nhớ — lần thứ hai kéo sập cả giao diện DSM, ping
#  vẫn thông mà không dịch vụ nào còn trả lời.
#
#  `mem_limit` ở đây KHÔNG phải để tiết kiệm. Nó để đổi kiểu hỏng: container
#  nào vượt mức thì chính nó bị hạ, thay vì hệ điều hành đi tìm tiến trình to
#  nhất mà giết — và tiến trình to nhất thường là thứ đang giữ cả NAS chạy.
#  Hỏng một container thì khởi động lại được; hỏng DSM thì phải tới tận nơi.
#
#  Tổng mức trần của cụm này ~640MB. Trên máy còn phải nuôi DSM, solar và
#  nas-uploader, nên nếu vẫn sập thì phải BỚT thứ chạy, không phải chỉnh số.
# ---------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: storechecking-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: storechecking
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # C collation: faster and stable, and does not depend on the host locale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    # Trần bộ nhớ + cấu hình cho máy nhỏ. Mặc định của Postgres nhắm tới máy chủ
    # thật: shared_buffers 128MB và tối đa 100 kết nối, mỗi kết nối là một tiến
    # trình riêng. Trên 1GB thì chỉ riêng chỗ đó đã đủ gây hoạ.
    mem_limit: 224m
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c work_mem=2MB
      -c maintenance_work_mem=24MB
      -c effective_cache_size=96MB
      -c max_worker_processes=2
      -c max_parallel_workers=0
      -c max_parallel_workers_per_gather=0
    volumes:
      # Named volume, không phải thư mục trên máy. Bind mount là thứ Postgres không chịu
      # được trên Windows: chủ sở hữu và quyền của thư mục Windows không ánh xạ sang được,
      # initdb bỏ cuộc ngay. Named volume để Docker tự quản, chạy giống nhau ở mọi máy.
      - pgdata:/var/lib/postgresql/data
      # Postgres runs the .sql files here automatically, but only while the volume is empty.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d storechecking"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Deliberately NOT published: only the api container talks to the database.
    expose:
      - "5432"

  api:
    # Built by GitHub Actions and pushed to GHCR — see .github/workflows/build-and-push.yml.
    # Neither machine at home builds .NET: on the NAS a build pins the CPU for 5-15 minutes
    # and makes the whole NAS unusable, phone uploads included; the PC is a company laptop
    # where Docker Desktop would need a paid licence.
    #
    # No pull_policy on purpose. The default ("missing") uses the image already on the NAS,
    # so Container Manager can start the project without registry credentials of its own —
    # watchtower carries the credentials and does every update from then on.
    image: ghcr.io/hoangan9999/storechecking-api:latest
    container_name: storechecking-api
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 1g
    volumes:
      # Ảnh tải lên và video tự sinh. Named volume chứ không phải bảng trong Postgres: dữ
      # liệu nhị phân trong database sẽ thổi bản sao lưu hằng ngày từ vài trăm KB lên hàng
      # GB, mà bản đó đang được đẩy qua mạng sang NAS mỗi đêm.
      - media:/data/media
    labels:
      # Watchtower only touches containers carrying this scope, so the other apps on this
      # NAS (solar, nas-uploader) are never restarted behind your back.
      com.centurylinklabs.watchtower.scope: storechecking
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=storechecking;Username=${DB_USER};Password=${DB_PASSWORD}"
      # Only used to fetch the public key that validates tokens. No data is stored on Supabase.
      Auth__SupabaseUrl: ${SUPABASE_URL}
      # Origins allowed to call this API, comma separated.
      Cors__Origins: ${CORS_ORIGINS}
      ASPNETCORE_ENVIRONMENT: Production

      # .NET đọc được trần của container và tự co heap theo. Hai biến dưới đây
      # đẩy nó đi xa hơn nữa: gom rác chăm hơn, giữ ít bộ nhớ dự trữ hơn — đánh
      # đổi chút CPU lấy chỗ trống, đúng thứ máy này thiếu.
      DOTNET_gcServer: "0"
      DOTNET_GCConserveMemory: "7"

      # ---------- Kho ảnh / video tự sinh ----------
      Media__Root: /data/media
      # Nhìn ảnh nhận ra là xe gì rồi viết kịch bản. Cùng model mà các hàm trên Vercel đang
      # dùng, và nó nhận ảnh đầu vào — đã tra tài liệu chính thức, không đoán.
      Media__GeminiApiKey: ${GEMINI_API_KEY}
      # Giọng Adam chạy TRÊN CHÍNH MÁY NÀY, ngoài Docker. host.docker.internal là đường từ
      # trong container ra máy thật — đã thử từ trong container, trả 200.
      Media__TtsUrl: http://host.docker.internal:5050/

      # ---------- Đăng video lên Fanpage ----------
      # Video dựng xong là tự đăng. Thiếu hai biến đầu thì bỏ qua phần đăng, video vẫn
      # dựng bình thường. Cùng cặp khoá mà hàm trên Vercel đang dùng.
      Facebook__PageId: ${FB_PAGE_ID:-}
      Facebook__AccessToken: ${FB_PAGE_ACCESS_TOKEN:-}
      # Mặc định KHÔNG tự đăng — bấm nút trên từng video. Đặt true để tự đăng cả mẻ.
      Facebook__AutoPost: ${FB_AUTOPOST:-false}
      Facebook__OrderLink: ${ORDER_LINK:-}
      # The API applies db/*.sql itself at startup. Set SCHEMA_AUTOMIGRATE=false in .env
      # to switch that off — the escape hatch for getting the API up while the schema is
      # being sorted out by hand. Declared here because .env only substitutes into this
      # file; it does not reach the container on its own.
      Schema__AutoMigrate: ${SCHEMA_AUTOMIGRATE:-true}
    ports:
      # Published for LAN access and debugging. Traffic from outside the house comes in
      # through the tailscale service below instead.
      - "8140:8080"

  # Watches GHCR for a newly pushed image, pulls it and restarts the API on its own.
  # This is what makes deploying one command on the PC with nothing to do on the NAS.
  #
  # Needs ./watchtower/config.json — a read-only GHCR token, because the image is private.
  # That file holds a secret: it is created by hand on the NAS and never committed.
  # Docker turns a missing bind-mount source into a DIRECTORY, which silently breaks the
  # login, so create the file BEFORE starting this project.
  # Nếu NAS còn sập vì bộ nhớ thì XOÁ HẲN service này trước tiên: nó chỉ để tự
  # động cập nhật ảnh. Bỏ đi thì mỗi lần deploy phải vào Container Manager kéo
  # ảnh mới và khởi động lại bằng tay — đổi lại bớt một tiến trình thường trú và
  # bớt nguy cơ nó kéo ảnh về đúng lúc máy đang chật.
  watchtower:
    image: containrrr/watchtower:latest
    container_name: storechecking-watchtower
    restart: unless-stopped
    mem_limit: 64m
    logging: *default-logging
    labels:
      com.centurylinklabs.watchtower.scope: storechecking
    environment:
      # Ignore every container that is not part of this project.
      WATCHTOWER_SCOPE: storechecking
      WATCHTOWER_POLL_INTERVAL: 60
      # Delete the image it replaced, otherwise old builds slowly fill the NAS disk.
      WATCHTOWER_CLEANUP: "true"
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./watchtower/config.json:/config.json:ro

  # Gives the API a real HTTPS certificate on the tailnet:
  #   https://storechecking.<tailnet>.ts.net
  # This is REQUIRED, not a nicety: the Angular app is served over HTTPS from Vercel, and
  # browsers hard-block an HTTPS page from calling a plain http:// address. Without a
  # valid certificate the app cannot reach this API at all.
  #
  # AllowFunnel is REQUIRED, not optional. Without it the hostname only resolves inside
  # the tailnet to a private 100.x address, and browsers refuse to let a public HTTPS page
  # (the app on Vercel) call into a private network — the request is blocked before it is
  # even sent. Funnel gives the hostname a real public address, which is exactly why
  # nas-uploader has always worked from the same app.
  #
  # Security: every data endpoint requires a valid Supabase JWT, verified against
  # Supabase's public key. Only /health is open, and it returns nothing sensitive.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: storechecking-ts
    hostname: storechecking            # decides the URL: storechecking.<tailnet>.ts.net
    restart: unless-stopped
    mem_limit: 96m
    logging: *default-logging
    depends_on:
      - api
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      # Danh tính của node trên tailnet. Named volume vì cùng lý do với pgdata — và tuyệt
      # đối KHÔNG chép từ máy cũ sang: hai máy dùng chung một danh tính thì Tailscale coi
      # là một node, và chúng sẽ đá nhau ra khỏi mạng.
      - ts-state:/var/lib/tailscale
      - ./ts-config:/config:ro
    cap_add:
      - NET_ADMIN

volumes:
  pgdata:
  ts-state:
  media:
