# Runs on the Synology NAS (Container Manager -> Project).
# Deploy path: /volume1/docker/storechecking  — one folder per app, matching the
# existing `solar` and `nas-uploader` folders. Container names are prefixed the same
# way `solar-*` containers are, so they stay distinguishable in Container Manager.
#
# Before building: create a .env file next to this one (see .env.example).
#
# Port 8140 was picked to avoid the services already running on this NAS:
#   8130 = solar-web, 8123 = home assistant (disabled), 1883 = mqtt

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: storechecking-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: storechecking
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # C collation: faster and stable, and does not depend on the host locale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Postgres runs the .sql files here automatically, but only while the volume is empty.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d storechecking"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Deliberately NOT published: only the api container talks to the database.
    expose:
      - "5432"

  api:
    build: .
    container_name: storechecking-api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=db;Port=5432;Database=storechecking;Username=${DB_USER};Password=${DB_PASSWORD}"
      # Only used to fetch the public key that validates tokens. No data is stored on Supabase.
      Auth__SupabaseUrl: ${SUPABASE_URL}
      # Origins allowed to call this API, comma separated.
      Cors__Origins: ${CORS_ORIGINS}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      # Published for LAN access and debugging. Traffic from outside the house comes in
      # through the tailscale service below instead.
      - "8140:8080"

  # Gives the API a real HTTPS certificate on the tailnet:
  #   https://storechecking.<tailnet>.ts.net
  # This is REQUIRED, not a nicety: the Angular app is served over HTTPS from Vercel, and
  # browsers hard-block an HTTPS page from calling a plain http:// address. Without a
  # valid certificate the app cannot reach this API at all.
  #
  # AllowFunnel is REQUIRED, not optional. Without it the hostname only resolves inside
  # the tailnet to a private 100.x address, and browsers refuse to let a public HTTPS page
  # (the app on Vercel) call into a private network — the request is blocked before it is
  # even sent. Funnel gives the hostname a real public address, which is exactly why
  # nas-uploader has always worked from the same app.
  #
  # Security: every data endpoint requires a valid Supabase JWT, verified against
  # Supabase's public key. Only /health is open, and it returns nothing sensitive.
  tailscale:
    image: tailscale/tailscale:latest
    container_name: storechecking-ts
    hostname: storechecking            # decides the URL: storechecking.<tailnet>.ts.net
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - api
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - ./ts-state:/var/lib/tailscale
      - ./ts-config:/config:ro
    cap_add:
      - NET_ADMIN
