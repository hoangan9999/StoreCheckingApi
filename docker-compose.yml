# Chạy trên NAS Synology (Container Manager -> Project).
# Trước khi Build: tạo file .env cạnh file này (xem .env.example).
#
# Cổng 8140 chọn để không đụng các service đang chạy:
#   8130 = solar-web, 8123 = home assistant (đã tắt), 1883 = mqtt

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "3"

services:
  api-db:
    image: postgres:16-alpine
    container_name: api-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: storechecking
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      # Bảo Postgres so sánh chuỗi kiểu C -> nhanh và ổn định, không phụ thuộc locale
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      # Postgres TỰ CHẠY các file .sql ở đây khi volume còn trống (chỉ lần đầu).
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d storechecking"]
      interval: 10s
      timeout: 5s
      retries: 10
    # KHÔNG mở cổng ra ngoài: chỉ container api nói chuyện với DB.
    expose:
      - "5432"

  api:
    build: .
    container_name: api
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api-db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: "Host=api-db;Port=5432;Database=storechecking;Username=${DB_USER};Password=${DB_PASSWORD}"
      # Chỉ dùng để tải khoá công khai xác thực token — không lưu dữ liệu gì trên Supabase.
      Auth__SupabaseUrl: ${SUPABASE_URL}
      # Các origin được phép gọi API. Nhiều origin thì ngăn bằng dấu phẩy.
      Cors__Origins: ${CORS_ORIGINS}
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8140:8080"
