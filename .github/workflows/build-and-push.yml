# Runs the contract tests, then builds the API image and pushes it to GHCR. The PC no
# longer needs Docker at all: it is a company laptop, and Docker Desktop needs a paid
# licence there.
#
# The NAS must NEVER build .NET either — a build pins its CPU for 5-15 minutes and drags
# everything else down, phone uploads included. So GitHub builds, GHCR carries the image,
# and watchtower on the NAS pulls it and restarts the API by itself.
name: Build and push API image

on:
  # Every push to master, with no path filter on purpose. tools/deploy.ps1 waits until
  # /health reports the exact commit of HEAD, so a commit that produced no image would
  # leave the script waiting for a version that will never exist.
  push:
    branches: [master]
  # Lets a build be re-run by hand from the Actions tab without an empty commit.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/storechecking-api

jobs:
  # The contract tests need a real PostgreSQL: jsonb, ILIKE, gen_random_uuid() defaults and
  # the ordering that keeps paging stable all behave differently on an in-memory provider.
  # There is no Docker on the development machine, so this is the only place they run.
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storechecking_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check the test step can start before the server accepts
        # connections, and the suite then SKIPS itself instead of failing — a green run
        # that tested nothing.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Chạy test hợp đồng
        env:
          TEST_POSTGRES: Host=localhost;Port=5432;Database=storechecking_test;Username=postgres;Password=postgres
        run: |
          dotnet test StoreChecking.sln --configuration Release \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=results.trx" --results-directory ./trx

      # A skipped suite must never pass for a green build. These tests skip themselves
      # when no database answers — right on the development machine, badly wrong here,
      # where it would wave an untested commit straight through to the NAS.
      - name: Chặn trường hợp test tự bỏ qua hết
        run: |
          passed=$(grep -o 'passed="[0-9]*"' ./trx/results.trx | head -1 | grep -o '[0-9]*')
          echo "Số test đạt: ${passed:-0}"
          if [ "${passed:-0}" -lt 1 ]; then
            echo "::error::Không có test nào chạy thật — nhiều khả năng không nối được PostgreSQL."
            exit 1
          fi

  build:
    # Nothing reaches GHCR, and therefore nothing reaches the NAS, unless the contract
    # tests pass. This is the gate the pipeline was missing.
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR. GITHUB_TOKEN is enough — no personal token here.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Rút gọn mã commit
        id: vars
        # Fixed at 7 characters to match `git rev-parse --short=7` in tools/deploy.ps1.
        # Git's default --short length grows with the repo, which would silently break
        # the version comparison the deploy script relies on.
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      # Only a safety net: the Dockerfile cross-compiles, so nothing foreign-architecture
      # is normally executed. Registering QEMU costs a few seconds and turns a possible
      # baffling "exec format error" into a slow-but-working build.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build và đẩy ảnh
        uses: docker/build-push-action@v6
        with:
          context: .
          # The NAS is ARM64 — it asks the registry for linux/arm64/v8. An amd64-only
          # image fails there with "no matching manifest for linux/arm64/v8". amd64 is
          # built too so the image still runs on an Intel machine.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.vars.outputs.sha }}
          # `latest` is what watchtower follows; the commit tag is what makes a rollback
          # possible later.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
          # Without a layer cache every build restores NuGet packages from scratch.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tóm tắt
        run: |
          echo "Đã đẩy \`${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Watchtower trên NAS sẽ kéo về trong khoảng 60 giây." >> "$GITHUB_STEP_SUMMARY"
